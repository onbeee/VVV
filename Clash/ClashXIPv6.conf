# 基础配置
port: 7890
socks-port: 7891
mixed-port: 7893
allow-lan: false
bind-address: "*"
mode: rule
log-level: warning
ipv6: false
udp: true
find-process-mode: off
external-controller: 127.0.0.1:9090

# 性能优化
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
keep-alive-idle: 300
keep-alive-interval: 15
disable-keep-alive: false

# GEO 数据
geodata-mode: true
geo-auto-update: true
geo-update-interval: 168
geox-url:
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  mmdb: https://geodata.kelee.one/Country-Masaiki.mmdb
  asn: https://geodata.kelee.one/GeoLite2-ASN-P3TERX.mmdb

# TUN 模式（按需启用）
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# 嗅探配置
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443

# Profile配置
profile:
  store-selected: true
  store-fake-ip: false

# DNS
dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    # 本地网络
    - "+.lan"
    - "+.local"
    - "+.localhost"
    - "+.home.arpa"
    - "+.internal"
    - "+.localdomain"
    - "+.example"
    - "+.invalid"
    - "+.test"
    # Windows检测
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    # 时间同步
    - "time.*.com"
    - "ntp.*.com"
    # 游戏/STUN
    - "+.stun.*"
    - "+.test.steampowered.com"
    # QQ
    - "localhost.ptlogin2.qq.com"
    - "+.localhost.sec.qq.com"
    # 路由器
    - "router.asus.com"
    - "www.asusrouter.com"
    - "tplogin.cn"
    - "miwifi.com"
    - "www.miwifi.com"
    - "+.tplinkwifi.net"
    - "+.tendawifi.com"
    - "+.hiwifi.com"
    - "+.routerlogin.com"
    - "+.zte.home"
    # NAS / 局域网服务
    - "+.plex.direct"
    # 反向解析
    - "+.0.in-addr.arpa"
    - "+.10.in-addr.arpa"
    - "+.127.in-addr.arpa"
    - "+.168.192.in-addr.arpa"
    # 额外自动排除
    - "+.nodecon.uk"
    - "+.266nets.com"
    - "+.37ccys.uk"

  # DNS入口
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 国内DNS
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # 国外DNS
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query

  # 节点域名解析
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query

  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4

proxies:

# 策略组
proxy-groups:
  - { name: "策略模式", type: select, proxies: [] }
  - { name: "推特服务", type: select, proxies: ["策略模式","优选模式"] }
  - { name: "飞机服务", type: select, proxies: ["策略模式","优选模式"] }
  - { name: "游戏服务", type: select, proxies: ["策略模式","优选模式","DIRECT"] }
  - { name: "智能服务", type: select, proxies: ["策略模式","优选模式","定点模式"] }
  - { name: "国际服务", type: select, proxies: ["策略模式","优选模式"] }
  - { name: "定点模式", type: select, proxies: [] }
  - { name: "优选模式", type: url-test, lazy: true, url: https://www.gstatic.com/generate_204, interval: 300, tolerance: 50, timeout: 5000, max-failed-times: 3, proxies: [] }

# 订阅规则
rule-providers:
  局域网络:
    type: http
    path: ./Clash/Lan.yaml
    url: https://rule.kelee.one/Clash/Lan.yaml
    behavior: classical
    interval: 86400
    format: yaml

  规则修正:
    type: http
    path: ./Clash/Direct.yaml
    url: https://rule.kelee.one/Clash/Direct.yaml
    behavior: classical
    interval: 86400
    format: yaml

  推特服务:
    type: http
    path: ./Clash/Twitter.yaml
    url: https://rule.kelee.one/Clash/Twitter.yaml
    behavior: classical
    interval: 86400
    format: yaml

  飞机服务:
    type: http
    path: ./Clash/Telegram.yaml
    url: https://rule.kelee.one/Clash/Telegram.yaml
    behavior: classical
    interval: 86400
    format: yaml

  游戏服务:
    type: http
    path: ./Clash/Game.yaml
    url: https://rule.kelee.one/Clash/Game.yaml
    behavior: classical
    interval: 86400
    format: yaml

  智能服务:
    type: http
    path: ./Rule/AI.yaml
    url: https://kelee.one/Tool/Clash/Rule/AI.yaml
    behavior: classical
    interval: 86400
    format: yaml

  国际服务:
    type: http
    path: ./Clash/Proxy.yaml
    url: https://rule.kelee.one/Clash/Proxy.yaml
    behavior: classical
    interval: 86400
    format: yaml

  国内服务:
    type: http
    path: ./Clash/China.yaml
    url: https://rule.kelee.one/Clash/China.yaml
    behavior: classical
    interval: 86400
    format: yaml

# 本地规则
rules:
  - RULE-SET,局域网络,DIRECT
  - RULE-SET,规则修正,DIRECT
  - RULE-SET,推特服务,推特服务
  - RULE-SET,飞机服务,飞机服务
  - RULE-SET,游戏服务,游戏服务
  - RULE-SET,智能服务,智能服务
  - RULE-SET,国际服务,国际服务
  - RULE-SET,国内服务,DIRECT
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,策略模式
